{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 id="greeting">Dashboard</h1>
    <div class="page-subtitle" id="greeting-sub"></div>
  </div>
</div>

<div class="stats-grid" id="stats">
  <div class="stat-card">
    <div class="stat-value" id="stat-suppliers">—</div>
    <div class="stat-label">Suppliers</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-items">—</div>
    <div class="stat-label">Total Items</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-quotes">—</div>
    <div class="stat-label">Quotations Made</div>
  </div>
</div>

<div class="section-row">
  <div class="card flex-1">
    <div class="card-header">
      <h2>Recent Quotations</h2>
      <a href="/history" class="link-sm">View all →</a>
    </div>
    <div id="recent-quotes">
      <div class="empty-state">Loading...</div>
    </div>
  </div>
  <div class="card" style="width:300px">
    <div class="card-header"><h2>Quick Actions</h2></div>
    <div class="quick-actions">
      <a href="/quotation/new" class="btn btn-primary btn-block">+ New Quotation</a>
      <a href="/catalogs" class="btn btn-outline btn-block">Manage Catalogs</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function renderGreeting() {
  const username = {{ session.username|tojson }};
  const hour = new Date().getHours();
  const timeGreeting = hour < 5 ? 'Burning the midnight oil,' : hour < 12 ? 'Good morning,' : hour < 17 ? 'Good afternoon,' : hour < 21 ? 'Good evening,' : 'Working late,';
  document.getElementById('greeting').textContent = `${timeGreeting} ${username}`;
  document.getElementById('greeting-sub').textContent = "Here's what's happening with your quotations.";
}
renderGreeting();

async function loadDashboard() {
  const [suppliers, quotes] = await Promise.all([
    fetch('/api/suppliers').then(r => r.json()),
    fetch('/api/quotations').then(r => r.json()),
  ]);
  const itemCount = suppliers.reduce((s, x) => s + (x.item_count || 0), 0);
  document.getElementById('stat-suppliers').textContent = suppliers.length;
  document.getElementById('stat-items').textContent = itemCount.toLocaleString();
  document.getElementById('stat-quotes').textContent = quotes.length;

  const el = document.getElementById('recent-quotes');
  if (!quotes.length) {
    el.innerHTML = '<div class="empty-state">No quotations yet. <a href="/quotation/new">Create one →</a></div>';
    return;
  }
  el.innerHTML = quotes.slice(0, 8).map(q => {
    const total = q.subtotal * (1 + (q.gst_rate || 0) / 100);
    const tags = (q.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    const worker = q.updated_by || q.created_by;
    return `
    <div class="quote-row">
      <div>
        <div class="quote-num">${esc(q.quote_number)}</div>
        <div class="quote-client">${esc(q.client_name)}</div>
        ${worker ? `<div class="attribution" style="margin-top:3px"><span class="avatar-chip">${esc(worker[0]).toUpperCase()}</span><span>${esc(worker)}</span></div>` : ''}
        ${tags.length ? `<div class="quote-tags">${tags.map(t => `<span class="badge tag-badge">${esc(t)}</span>`).join(' ')}</div>` : ''}
      </div>
      <div class="quote-meta">
        <span class="quote-amount">₹ ${total.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>
        <span class="badge">${q.item_count} items</span>
        <span class="quote-date">${esc(q.date)}</span>
        <a href="/quotation/${q.id}/edit" class="btn btn-sm">Open</a>
      </div>
    </div>
  `;
  }).join('');
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
loadDashboard();
</script>
{% endblock %}
