{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Quotation History</h1>
  <a href="/quotation/new" class="btn btn-primary">+ New Quote</a>
</div>

<div class="card">
  <div class="toolbar">
    <input type="text" id="search-quotes" class="input" placeholder="Search by client, quote number, or tag…" oninput="filterQuotes()" />
    <select id="filter-user" class="input filter-user-select" onchange="filterQuotes()">
      <option value="">Everyone on the team</option>
    </select>
  </div>
  <div class="table-wrap history-table-wrap">
    <table class="data-table" id="quotes-table">
      <thead>
        <tr>
          <th>Quote No.</th>
          <th>Client</th>
          <th>Date</th>
          <th>Items</th>
          <th>Tags</th>
          <th>Last worked on by</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="quotes-tbody">
        <tr><td colspan="7" class="empty-state">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="history-cards" id="history-cards"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
let allQuotes = [];
const AVATAR_COLORS = ['#4f46e5','#0891b2','#059669','#d97706','#db2777','#7c3aed','#dc2626'];

function avatarColor(name) {
  let hash = 0;
  for (const ch of String(name || '?')) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

async function loadHistory() {
  allQuotes = await fetch('/api/quotations').then(r => r.json());
  const users = [...new Set(allQuotes.map(q => q.updated_by || q.created_by).filter(Boolean))].sort();
  const sel = document.getElementById('filter-user');
  users.forEach(u => {
    const o = document.createElement('option');
    o.value = u; o.textContent = u;
    sel.appendChild(o);
  });
  const urlUser = new URLSearchParams(location.search).get('user');
  if (urlUser) { sel.value = urlUser; filterQuotes(); }
  else renderQuotes(allQuotes);
}

function filterQuotes() {
  const q = document.getElementById('search-quotes').value.toLowerCase();
  const userFilter = document.getElementById('filter-user').value;
  renderQuotes(allQuotes.filter(x =>
    (x.quote_number.toLowerCase().includes(q) ||
     x.client_name.toLowerCase().includes(q) ||
     (x.tags || '').toLowerCase().includes(q)) &&
    (!userFilter || x.updated_by === userFilter || x.created_by === userFilter)
  ));
}

function rowMenuHtml(q) {
  return `
    <div class="row-menu-wrap">
      <button class="row-menu-btn" onclick="toggleRowMenu(this)" aria-label="More actions">⋮</button>
      <div class="row-menu hidden">
        <a href="/quotation/${q.id}/edit" class="row-menu-item">✏️ Edit</a>
        <button class="row-menu-item" onclick="copyShareLink(${q.id})">📋 Copy Link</button>
        <button class="row-menu-item" onclick="shareViaWhatsApp(${q.id}, '${esc(jsAttr(q.client_name))}')">💬 Send via WhatsApp</button>
        <a href="/api/quotations/${q.id}/export/pdf" class="row-menu-item" target="_blank">⬇ Download PDF</a>
        <a href="/api/quotations/${q.id}/export/excel" class="row-menu-item">⬇ Download Excel</a>
        <button class="row-menu-item danger" onclick="deleteQuote(${q.id})">🗑 Delete</button>
      </div>
    </div>
  `;
}

function renderQuotes(quotes) {
  const tbody = document.getElementById('quotes-tbody');
  const cards = document.getElementById('history-cards');
  if (!quotes.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No quotations found</td></tr>';
    cards.innerHTML = '<div class="empty-state">No quotations found</div>';
    return;
  }

  tbody.innerHTML = quotes.map(q => {
    const worker = q.updated_by || q.created_by || 'Unknown';
    const isEdit = q.updated_by && q.updated_by !== q.created_by;
    return `
    <tr>
      <td><strong>${esc(q.quote_number)}</strong></td>
      <td>${esc(q.client_name)}</td>
      <td>${esc(q.date)}</td>
      <td><span class="badge">${q.item_count} items</span></td>
      <td>${(q.tags || '').split(',').map(t => t.trim()).filter(Boolean).map(t => `<span class="badge tag-badge">${esc(t)}</span>`).join(' ') || '—'}</td>
      <td>
        <div class="attribution" title="${isEdit ? `Created by ${esc(q.created_by)}, last edited by ${esc(worker)}` : `Created by ${esc(worker)}`}">
          <span class="avatar-chip" style="background:${avatarColor(worker)}22;color:${avatarColor(worker)}">${esc(worker[0] || '?').toUpperCase()}</span>
          <span>${esc(worker)}</span>
          ${isEdit ? '<span class="dot"></span><span>edited</span>' : ''}
        </div>
      </td>
      <td class="actions-cell">${rowMenuHtml(q)}</td>
    </tr>
  `;
  }).join('');

  cards.innerHTML = quotes.map(q => {
    const worker = q.updated_by || q.created_by || 'Unknown';
    const isEdit = q.updated_by && q.updated_by !== q.created_by;
    const tags = (q.tags || '').split(',').map(t => t.trim()).filter(Boolean);
    return `
    <div class="history-card">
      <div class="history-card-top">
        <div>
          <div class="quote-num">${esc(q.quote_number)}</div>
          <div class="quote-client">${esc(q.client_name)}</div>
        </div>
        ${rowMenuHtml(q)}
      </div>
      ${tags.length ? `<div class="history-card-tags">${tags.map(t => `<span class="badge tag-badge">${esc(t)}</span>`).join(' ')}</div>` : ''}
      <div class="history-card-footer">
        <div class="attribution">
          <span class="avatar-chip" style="background:${avatarColor(worker)}22;color:${avatarColor(worker)}">${esc(worker[0] || '?').toUpperCase()}</span>
          <span>${esc(worker)}</span>
          ${isEdit ? '<span class="dot"></span><span>edited</span>' : ''}
        </div>
        <div class="history-card-meta">
          <span class="badge">${q.item_count} items</span>
          <span class="quote-date">${esc(q.date)}</span>
        </div>
      </div>
    </div>
  `;
  }).join('');
}

function closeAllRowMenus() {
  document.querySelectorAll('.row-menu').forEach(m => m.classList.add('hidden'));
}

function toggleRowMenu(btn) {
  const menu = btn.nextElementSibling;
  const wasHidden = menu.classList.contains('hidden');
  closeAllRowMenus();
  if (wasHidden) menu.classList.remove('hidden');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.row-menu-wrap')) closeAllRowMenus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAllRowMenus();
});

async function deleteQuote(id) {
  if (!confirm('Delete this quotation?')) return;
  await fetch(`/api/quotations/${id}`, {method: 'DELETE'});
  allQuotes = allQuotes.filter(q => q.id !== id);
  renderQuotes(allQuotes);
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// For values embedded as a single-quoted JS string literal inside an
// onclick="..." (double-quoted) HTML attribute.
function jsAttr(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' '); }

loadHistory();
</script>
{% endblock %}
